name: Análise Diária de Editais PNUD/UNESCO/OEI

on:
  schedule:
    - cron: '0 12 * * *'  # 9h BRT (12h UTC)
  workflow_dispatch:       # permite rodar manualmente

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar uv
        run: pip install uv

      - name: Instalar dependências
        run: uv pip install --system -r <(uv pip compile pyproject.toml -q)

      - name: Instalar Playwright + Chromium
        run: playwright install --with-deps chromium

      - name: Executar pipeline diário
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py daily

      # if: always() — mesmo que "Executar pipeline diário" falhe (ex.: erro na
      # geração do relatório), o scraping e o download de ToRs já podem ter
      # avançado; sem isso, o step de commit é pulado e todo esse progresso
      # é perdido no runner efêmero.
      - name: Commit e push (apenas se houver alterações)
        if: always()
        run: |
          git config user.name "analise-editais-bot"
          git config user.email "bot@analise-editais.local"
          git add dados/ dados_brutos/ docs/ analise_editais_pnud.xlsx relatorio_editais_pnud.pdf
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "🤖 Daily run: $(date +'%Y-%m-%d %H:%M')" && git push
          fi
